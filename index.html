  <style>
    /* =========================================================
       THINKPLUS CLOUD
       MODERN SAAS LANDING PAGE
       ========================================================= */

    :root {
      --bg: #050817;
      --bg-soft: #080d25;
      --bg-card: rgba(255, 255, 255, 0.055);

      --primary: #2563eb;
      --primary-light: #4f7cff;
      --primary-dark: #1d4ed8;

      --accent: #22c55e;
      --gold: #f5b700;

      --white: #ffffff;
      --text: #f8fafc;
      --muted: #aab6cc;
      --muted-light: #cbd5e1;

      --border: rgba(255, 255, 255, 0.09);

      --radius-sm: 12px;
      --radius-md: 18px;
      --radius-lg: 28px;

      --shadow:
        0 25px 70px rgba(0, 0, 0, 0.35);

      --max-width: 1160px;
    }

    /* =========================================================
       RESET
       ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(37, 99, 235, 0.22),
          transparent 38%
        ),
        linear-gradient(
          180deg,
          #050817 0%,
          #080d25 45%,
          #050817 100%
        );

      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      color: inherit;
    }

    img {
      max-width: 100%;
      display: block;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================================================
       UTILITIES
       ========================================================= */

    .container {
      width: min(var(--max-width), 92%);
      margin-inline: auto;
    }

    .text-center {
      text-align: center;
    }

    .muted {
      color: var(--muted);
    }

    .section {
      padding: 100px 0;
    }

    .section-header {
      max-width: 760px;
      margin: 0 auto 55px;
      text-align: center;
    }

    .section-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 7px 13px;

      border-radius: 999px;

      background:
        rgba(37, 99, 235, 0.12);

      border:
        1px solid rgba(79, 124, 255, 0.25);

      color:
        #bcd1ff;

      font-size: 13px;
      font-weight: 700;

      margin-bottom: 16px;
    }

    .section-title {
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.1;
      letter-spacing: -0.04em;

      margin-bottom: 16px;
    }

    .section-description {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.8;
    }

    /* =========================================================
       HEADER
       ========================================================= */

    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;

      border-bottom:
        1px solid var(--border);

      background:
        rgba(5, 8, 23, 0.82);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);
    }

    .navbar {
      min-height: 76px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 25px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;

      text-decoration: none;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .brand-icon {
      width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary-light)
        );

      box-shadow:
        0 10px 30px rgba(37, 99, 235, 0.35);

      font-size: 11px;
      font-weight: 800;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-links a {
      color: var(--muted-light);
      text-decoration: none;

      font-size: 14px;
      font-weight: 600;

      transition:
        color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--white);
    }

    /* =========================================================
       BUTTONS
       ========================================================= */

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      min-height: 48px;

      padding: 12px 20px;

      border-radius: 13px;

      text-decoration: none;

      font-size: 14px;
      font-weight: 700;

      border: 1px solid transparent;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      color: white;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary-light)
        );

      box-shadow:
        0 12px 30px rgba(37, 99, 235, 0.28);
    }

    .btn-primary:hover {
      box-shadow:
        0 16px 40px rgba(37, 99, 235, 0.38);
    }

    .btn-secondary {
      color: white;

      background:
        rgba(255, 255, 255, 0.055);

      border-color:
        var(--border);
    }

    .btn-secondary:hover {
      background:
        rgba(255, 255, 255, 0.09);
    }

    .btn-whatsapp {
      background:
        #16a34a;

      color:
        white;

      box-shadow:
        0 12px 30px rgba(22, 163, 74, 0.25);
    }

    .btn-gold {
      background:
        linear-gradient(
          135deg,
          #d4af37,
          #f4d06f
        );

      color:
        #171717;

      box-shadow:
        0 12px 30px rgba(212, 175, 55, 0.22);
    }

    /* =========================================================
       HERO
       ========================================================= */

    .hero {
      position: relative;

      padding:
        105px 0
        90px;

      overflow: hidden;
    }

    .hero::before {
      content: "";

      position: absolute;

      width: 500px;
      height: 500px;

      top: -220px;
      left: 50%;

      transform: translateX(-50%);

      background:
        rgba(37, 99, 235, 0.18);

      filter:
        blur(100px);

      border-radius:
        50%;

      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;

      max-width: 900px;
      margin: auto;

      text-align: center;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 8px 15px;

      border-radius: 999px;

      border:
        1px solid rgba(79, 124, 255, 0.28);

      background:
        rgba(37, 99, 235, 0.1);

      color:
        #c8d8ff;

      font-size: 13px;
      font-weight: 700;

      margin-bottom: 24px;
    }

    .hero h1 {
      font-size:
        clamp(2.7rem, 7vw, 5.3rem);

      line-height:
        1.02;

      letter-spacing:
        -0.065em;

      max-width:
        900px;

      margin:
        0 auto 25px;

      background:
        linear-gradient(
          135deg,
          #ffffff 20%,
          #dbe7ff 48%,
          #6f8fff 100%
        );

      -webkit-background-clip:
        text;

      background-clip:
        text;

      -webkit-text-fill-color:
        transparent;
    }

    .hero h1 span {
      background:
        linear-gradient(
          135deg,
          #60a5fa,
          #4f46e5
        );

      -webkit-background-clip:
        text;

      background-clip:
        text;

      -webkit-text-fill-color:
        transparent;
    }

    .hero-description {
      max-width:
        720px;

      margin:
        0 auto 34px;

      color:
        var(--muted);

      font-size:
        clamp(16px, 2vw, 19px);

      line-height:
        1.8;
    }

    .hero-actions {
      display:
        flex;

      justify-content:
        center;

      flex-wrap:
        wrap;

      gap:
        12px;

      margin-bottom:
        24px;
    }

    .hero-note {
      color:
        #8f9bb1;

      font-size:
        13px;
    }

    /* =========================================================
       HERO DASHBOARD PREVIEW
       ========================================================= */

    .dashboard-preview {
      position:
        relative;

      max-width:
        980px;

      margin:
        70px auto 0;

      padding:
        10px;

      border-radius:
        24px;

      background:
        linear-gradient(
          135deg,
          rgba(79, 124, 255, 0.35),
          rgba(255, 255, 255, 0.04)
        );

      box-shadow:
        0 40px 100px rgba(0, 0, 0, 0.45);
    }

    .dashboard-window {
      overflow:
        hidden;

      border-radius:
        18px;

      border:
        1px solid rgba(255,255,255,.09);

      background:
        #0b1028;
    }

    .window-bar {
      height:
        46px;

      display:
        flex;

      align-items:
        center;

      gap:
        7px;

      padding:
        0 17px;

      background:
        #080d20;

      border-bottom:
        1px solid var(--border);
    }

    .window-dot {
      width:
        9px;

      height:
        9px;

      border-radius:
        50%;

      background:
        #334155;
    }

    .dashboard-body {
      display:
        grid;

      grid-template-columns:
        190px 1fr;

      min-height:
        350px;
    }

    .dashboard-sidebar {
      padding:
        22px 15px;

      border-right:
        1px solid var(--border);

      background:
        #080d20;
    }

    .side-brand {
      font-size:
        13px;

      font-weight:
        800;

      margin-bottom:
        28px;
    }

    .side-item {
      padding:
        10px 12px;

      border-radius:
        9px;

      color:
        #8290aa;

      font-size:
        11px;

      margin-bottom:
        5px;
    }

    .side-item.active {
      background:
        rgba(37, 99, 235, 0.16);

      color:
        #8db0ff;
    }

    .dashboard-main {
      padding:
        24px;
    }

    .dashboard-heading {
      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      margin-bottom:
        20px;
    }

    .dashboard-heading strong {
      font-size:
        16px;
    }

    .dashboard-heading small {
      color:
        #75829a;

      font-size:
        10px;
    }

    .mini-grid {
      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap:
        12px;

      margin-bottom:
        15px;
    }

    .mini-card {
      padding:
        17px;

      border:
        1px solid var(--border);

      border-radius:
        13px;

      background:
        rgba(255,255,255,.035);
    }

    .mini-card small {
      display:
        block;

      color:
        #77859e;

      font-size:
        9px;

      margin-bottom:
        8px;
    }

    .mini-card strong {
      font-size:
        19px;
    }

    .mini-card.blue strong {
      color:
        #6fa0ff;
    }

    .mini-card.green strong {
      color:
        #4ade80;
    }

    .mini-card.gold strong {
      color:
        #facc15;
    }

    .chart-card {
      padding:
        20px;

      border:
        1px solid var(--border);

      border-radius:
        13px;

      background:
        rgba(255,255,255,.035);
    }

    .chart-title {
      font-size:
        11px;

      color:
        #8290aa;

      margin-bottom:
        20px;
    }

    .chart-bars {
      height:
        120px;

      display:
        flex;

      align-items:
        flex-end;

      justify-content:
        space-between;

      gap:
        10px;
    }

    .bar {
      width:
        100%;

      max-width:
        38px;

      border-radius:
        6px 6px 2px 2px;

      background:
        linear-gradient(
          180deg,
          #4f7cff,
          #2563eb
        );

      opacity:
        .8;
    }

    /* =========================================================
       TRUST STRIP
       ========================================================= */

    .trust-strip {
      border-top:
        1px solid var(--border);

      border-bottom:
        1px solid var(--border);

      background:
        rgba(255,255,255,.025);

      padding:
        24px 0;
    }

    .trust-content {
      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      flex-wrap:
        wrap;

      gap:
        30px;

      color:
        #8794aa;

      font-size:
        13px;

      font-weight:
        600;
    }

    .trust-item {
      display:
        flex;

      align-items:
        center;

      gap:
        8px;
    }

    .trust-check {
      color:
        #4ade80;

      font-weight:
        800;
    }

    /* =========================================================
       FEATURES
       ========================================================= */

    .features {
      background:
        rgba(255,255,255,.012);
    }

    .feature-grid {
      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap:
        18px;
    }

    .feature-card {
      padding:
        28px;

      border:
        1px solid var(--border);

      border-radius:
        var(--radius-md);

      background:
        var(--bg-card);

      transition:
        transform .2s ease,
        border-color .2s ease;
    }

    .feature-card:hover {
      transform:
        translateY(-5px);

      border-color:
        rgba(79,124,255,.35);
    }

    .feature-icon {
      width:
        48px;

      height:
        48px;

      display:
        grid;

      place-items:
        center;

      border-radius:
        14px;

      background:
        rgba(37,99,235,.13);

      border:
        1px solid rgba(79,124,255,.18);

      font-size:
        21px;

      margin-bottom:
        18px;
    }

    .feature-card h3 {
      font-size:
        17px;

      margin-bottom:
        9px;
    }

    .feature-card p {
      color:
        var(--muted);

      font-size:
        14px;

      line-height:
        1.75;
    }

    /* =========================================================
       HOW IT WORKS
       ========================================================= */

    .steps {
      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap:
        20px;
    }

    .step {
      position:
        relative;

      padding:
        30px;

      border:
        1px solid var(--border);

      border-radius:
        var(--radius-md);

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.045),
          rgba(255,255,255,.02)
        );
    }

    .step-number {
      width:
        38px;

      height:
        38px;

      display:
        grid;

      place-items:
        center;

      border-radius:
        11px;

      background:
        var(--primary);

      font-weight:
        800;

      margin-bottom:
        18px;
    }

    .step h3 {
      margin-bottom:
        8px;

      font-size:
        17px;
    }

    .step p {
      color:
        var(--muted);

      font-size:
        14px;

      line-height:
        1.7;
    }

    /* =========================================================
       PRICING
       ========================================================= */

    .pricing-section {
      background:
        #070c22;
    }

    .pricing-grid {
      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap:
        20px;

      align-items:
        stretch;
    }

    .pricing-card {
      position:
        relative;

      display:
        flex;

      flex-direction:
        column;

      padding:
        34px 28px;

      border:
        1px solid var(--border);

      border-radius:
        var(--radius-lg);

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.055),
          rgba(255,255,255,.025)
        );

      box-shadow:
        0 20px 50px rgba(0,0,0,.18);
    }

    .pricing-card.featured {
      border:
        2px solid var(--primary);

      background:
        linear-gradient(
          180deg,
          rgba(37,99,235,.12),
          rgba(255,255,255,.035)
        );

      transform:
        translateY(-8px);
    }

    .popular {
      position:
        absolute;

      top:
        -14px;

      left:
        50%;

      transform:
        translateX(-50%);

      padding:
        7px 17px;

      border-radius:
        999px;

      background:
        var(--primary);

      color:
        white;

      font-size:
        11px;

      font-weight:
        800;

      white-space:
        nowrap;
    }

    .pricing-card h3 {
      font-size:
        20px;

      margin-bottom:
        7px;
    }

    .plan-description {
      color:
        var(--muted);

      font-size:
        13px;
    }

    .price {
      margin:
        24px 0 6px;

      display:
        flex;

      align-items:
        baseline;

      gap:
        6px;
    }

    .price-amount {
      font-size:
        35px;

      font-weight:
        800;

      letter-spacing:
        -0.04em;

      color:
        white;
    }

    .price-period {
      color:
        var(--muted);

      font-size:
        13px;
    }

    .custom-price {
      min-height:
        48px;
    }

    .plan-features {
      list-style:
        none;

      margin:
        24px 0 28px;

      flex:
        1;
    }

    .plan-features li {
      display:
        flex;

      align-items:
        flex-start;

      gap:
        9px;

      padding:
        10px 0;

      border-bottom:
        1px solid rgba(255,255,255,.055);

      color:
        #cbd5e1;

      font-size:
        13px;
    }

    .check {
      color:
        #4ade80;

      font-weight:
        800;
    }

    .pricing-card .btn {
      width:
        100%;
    }

    .pricing-note {
      margin-top:
        30px;

      text-align:
        center;

      color:
        #78869e;

      font-size:
        12px;
    }

    /* =========================================================
       SECURITY / VALUE
       ========================================================= */

    .value-grid {
      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        22px;
    }

    .value-card {
      padding:
        32px;

      border:
        1px solid var(--border);

      border-radius:
        var(--radius-lg);

      background:
        var(--bg-card);
    }

    .value-card h3 {
      font-size:
        20px;

      margin-bottom:
        10px;
    }

    .value-card > p {
      color:
        var(--muted);

      font-size:
        14px;

      line-height:
        1.75;

      margin-bottom:
        22px;
    }

    .value-list {
      list-style:
        none;
    }

    .value-list li {
      display:
        flex;

      gap:
        10px;

      padding:
        10px 0;

      color:
        #cbd5e1;

      font-size:
        14px;
    }

    /* =========================================================
       FOUNDER
       ========================================================= */

    .founder-section {
      background:
        rgba(255,255,255,.015);
    }

    .founder-card {
      display:
        grid;
